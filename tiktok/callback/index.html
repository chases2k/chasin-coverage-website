<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>TikTok connected — Chasin' Coverage</title>
<link rel="stylesheet" href="/tiktok/tiktok.css">
</head>
<body>
<main>
  <img class="logo" src="/assets/logo-128.png" alt="Chasin' Coverage">
  <h1 id="title">Connecting…</h1>
  <p id="who"></p>
  <div class="card" id="postCard" hidden>
    <p>Post a short test video to your TikTok as <strong>private (Only me)</strong>.</p>
    <input id="file" type="file" accept="video/mp4"><br>
    <button id="post" type="button" disabled>Post test video</button>
  </div>
  <div id="status" class="status"></div>
  <p><a class="btn" id="retry" href="/tiktok/" hidden>Back</a></p>
</main>
<script src="/tiktok/tiktok.js"></script>
<script>
(async () => {
  const p = new URLSearchParams(location.search);
  const code = p.get("code"), state = p.get("state"), err = p.get("error");
  const expected = sessionStorage.getItem("tt_state");
  sessionStorage.removeItem("tt_state");
  history.replaceState(null, "", location.pathname); // drop code from URL bar/history
  const fail = (m) => { $("title").textContent = "Not connected"; say(m, "err"); $("retry").hidden = false; };

  if (err) return fail("TikTok returned: " + err + " " + (p.get("error_description") || ""));
  if (!code) return fail("No authorization code. Start from the Connect page.");
  if (!state || state !== expected) return fail("State mismatch — possible CSRF. Please start again.");

  say("Exchanging code securely…");
  let session = "";
  try {
    const r = await fetch(TIKTOK_WORKER + "/token", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    session = d.session; // encrypted by the worker; never the raw token
    $("title").textContent = "TikTok connected";
    $("who").textContent = "Signed in as " + (d.display_name || "TikTok user") + " · scopes: " + (d.scope || "");
    $("postCard").hidden = false;
    say("");
  } catch (e) { return fail("Could not connect: " + e.message); }

  $("file").addEventListener("change", () => { $("post").disabled = !$("file").files.length; });
  $("post").addEventListener("click", async () => {
    const f = $("file").files[0];
    if (!f) return;
    $("post").disabled = true;
    say("Uploading " + f.name + " (" + (f.size / 1048576).toFixed(1) + " MB) as private…");
    try {
      const r = await fetch(TIKTOK_WORKER + "/post", {
        method: "POST", headers: { "Content-Type": "video/mp4", "X-TT-Session": session }, body: f,
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      say("Uploaded. publish_id " + d.publish_id + "\nWaiting for TikTok to process…");
      for (let i = 0; i < 30; i++) {
        await new Promise((res) => setTimeout(res, 4000));
        const s = await fetch(TIKTOK_WORKER + "/status", {
          method: "POST", headers: { "Content-Type": "application/json", "X-TT-Session": session },
          body: JSON.stringify({ publish_id: d.publish_id }),
        }).then((x) => x.json());
        if (s.error) throw new Error(s.error);
        if (s.status === "PUBLISH_COMPLETE") {
          return say("Posted to @" + (d.creator.username || "account") + " as private (Only me).\nStatus: PUBLISH_COMPLETE", "ok");
        }
        if (s.status === "FAILED") throw new Error("TikTok reported FAILED: " + (s.fail_reason || "unknown"));
        say("Status: " + s.status + " …");
      }
      say("Still processing — check the TikTok app (Profile → private videos).", "ok");
    } catch (e) { say("Post failed: " + e.message, "err"); $("post").disabled = false; }
  });
})();
</script>
</body>
</html>
